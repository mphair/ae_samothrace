<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Natural Earth Map</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      natural-earth-map {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="natural-earth-map-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          background: #1b1f27;
          color: #e6e9ef;
        }
        .toolbar {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px;
          background: #20262f;
          border-bottom: 1px solid #333c48;
          flex: 0 0 auto;
        }
        .toolbar-title {
          flex: 1 1 auto;
          font-size: 13px;
          color: #9aa5b5;
        }
        .home-button {
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          white-space: nowrap;
        }
        .home-button:hover {
          background: #344258;
        }
        .body-row {
          position: relative;
          flex: 1 1 auto;
          display: flex;
          min-height: 0;
        }
        .layers-panel {
          flex: 0 0 190px;
          overflow-y: auto;
          background: #181c23;
          border-right: 1px solid #333c48;
          padding: 10px 10px 16px;
          box-sizing: border-box;
          font-size: 12px;
        }
        .layer-group {
          margin: 14px 0 0;
        }
        .layer-group:first-of-type {
          margin-top: 0;
        }
        .layer-group-title {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #8a93a3;
          margin: 0 0 4px;
        }
        .layer-row {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 3px 0;
          cursor: pointer;
          user-select: none;
          line-height: 1.3;
        }
        .layer-row input {
          flex: 0 0 auto;
        }
        .layer-swatch {
          width: 10px;
          height: 10px;
          border-radius: 2px;
          flex: 0 0 auto;
        }
        .layer-count {
          color: #70798a;
          font-size: 10.5px;
          margin-left: auto;
        }
        .map-pane {
          position: relative;
          flex: 1 1 auto;
          min-width: 0;
          background: #0d1420;
          overflow: hidden;
        }
        .map-canvas {
          display: block;
          width: 100%;
          height: 100%;
          touch-action: none;
          cursor: grab;
        }
        .map-canvas:active {
          cursor: grabbing;
        }
        .zoom-controls {
          position: absolute;
          right: 10px;
          bottom: 10px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          border: 1px solid #3a4454;
          border-radius: 4px;
          overflow: hidden;
          background: #20262f;
        }
        .zoom-in-button,
        .zoom-out-button {
          width: 28px;
          height: 26px;
          border: none;
          background: transparent;
          color: #e6e9ef;
          font-size: 15px;
          cursor: pointer;
          line-height: 1;
        }
        .zoom-in-button:hover,
        .zoom-out-button:hover {
          background: #344258;
        }
        .zoom-label {
          position: absolute;
          left: 10px;
          bottom: 10px;
          font-size: 11px;
          padding: 3px 6px;
          border-radius: 3px;
          background: rgba(32, 38, 47, 0.85);
          color: #cbd5e1;
          pointer-events: none;
        }
        .hover-bar {
          position: absolute;
          left: 10px;
          top: 10px;
          max-width: calc(100% - 20px);
          font-size: 12px;
          padding: 5px 9px;
          border-radius: 4px;
          background: rgba(32, 38, 47, 0.9);
          border: 1px solid #3a4454;
          color: #e6e9ef;
          pointer-events: none;
          display: none;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.75);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }
        /* Startup load-retry UI (RetryingLoader, natural-earth-map.ts) --
           rendered INTO .status-overlay above (same container, this is
           just its populated-with-a-failure-and-countdown content), not
           a separate element -- a plain "Loading…" message uses the
           same container with no .retry-box wrapper at all. */
        .retry-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          max-width: 320px;
        }
        .retry-message {
          line-height: 1.4;
        }
        .retry-countdown {
          font-size: 11.5px;
          color: #9aa5b5;
        }
        .retry-button {
          margin-top: 4px;
          font-size: 12px;
          padding: 6px 14px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .retry-button:hover {
          background: #344258;
        }
      </style>
      <div class="wrap">
        <div class="toolbar">
          <span class="toolbar-title">Natural Earth — Samothrace region</span>
          <button type="button" class="home-button" title="Fit to data">⟲ Overview</button>
        </div>
        <div class="body-row">
          <div class="layers-panel">
            <div class="layers-list"></div>
          </div>
          <div class="map-pane">
            <canvas class="map-canvas"></canvas>
            <div class="hover-bar"></div>
            <div class="zoom-controls">
              <button type="button" class="zoom-in-button" title="Zoom in">+</button>
              <button type="button" class="zoom-out-button" title="Zoom out">−</button>
            </div>
            <div class="zoom-label"></div>
            <div class="status-overlay"></div>
          </div>
        </div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <natural-earth-map></natural-earth-map>
  </body>
</html>
