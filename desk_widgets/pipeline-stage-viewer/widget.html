<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Pipeline Stage Viewer</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      pipeline-stage-viewer {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="pipeline-stage-viewer-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: row;
          background: #1b1f27;
          color: #e6e9ef;
        }
        .sidebar {
          flex: 0 0 240px;
          overflow-y: scroll;
          box-sizing: border-box;
          padding: 12px;
          background: #181c23;
          border-right: 1px solid #333c48;
          scrollbar-width: auto;
          scrollbar-color: #4a5568 #1b1f27;
        }
        .sidebar::-webkit-scrollbar {
          width: 12px;
        }
        .sidebar::-webkit-scrollbar-thumb {
          background: #4a5568;
          border-radius: 6px;
          border: 2px solid #1b1f27;
        }
        .sidebar h2 {
          font-size: 14px;
          margin: 0 0 10px;
        }
        .plan-select {
          width: 100%;
          box-sizing: border-box;
          font-size: 12px;
          padding: 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          margin-bottom: 14px;
        }
        .stage-list {
          display: flex;
          flex-direction: column;
          gap: 4px;
        }
        .stage-item {
          display: block;
          width: 100%;
          box-sizing: border-box;
          text-align: left;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 4px;
          color: #cbd5e1;
          font-size: 11.5px;
          padding: 8px;
          cursor: pointer;
          line-height: 1.3;
        }
        .stage-item:hover {
          background: #2a3444;
        }
        .stage-item.active {
          background: #2f5d7a;
          border-color: #4a8bb5;
          color: #fff;
        }
        .main {
          flex: 1 1 auto;
          min-width: 0;
          display: flex;
          flex-direction: column;
          padding: 12px;
          box-sizing: border-box;
          gap: 10px;
        }
        .stage-caption {
          font-size: 13px;
          color: #e6e9ef;
        }
        .toolbar {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        button {
          font-size: 12px;
          padding: 6px 12px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        button:hover {
          background: #344258;
        }
        .zoom-readout {
          font-size: 11.5px;
          color: #9aa5b5;
        }
        .canvas-pane {
          flex: 1 1 auto;
          min-height: 0;
          background: #808080;
          border: 1px solid #333c48;
          border-radius: 4px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .stage-canvas {
          width: 100%;
          height: 100%;
          touch-action: none;
          cursor: crosshair;
        }
        .hint {
          font-size: 11px;
          color: #70798a;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.82);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }
      </style>
      <div class="wrap">
        <div class="sidebar">
          <h2>Pipeline Stage Viewer</h2>
          <select class="plan-select"></select>
          <div class="stage-list"></div>
        </div>
        <div class="main">
          <div class="stage-caption"></div>
          <div class="toolbar">
            <button type="button" class="reset-zoom-button">⟲ Reset zoom</button>
            <div class="zoom-readout">Showing full extent</div>
          </div>
          <div class="canvas-pane">
            <canvas class="stage-canvas"></canvas>
          </div>
          <div class="hint">Drag a rectangle on the image to zoom in. Each stage's PNG is regenerated by scripts/extract_vector_layers.py every run.</div>
        </div>
        <div class="status-overlay"></div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <pipeline-stage-viewer></pipeline-stage-viewer>
  </body>
</html>
