<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Contour Label Review</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      contour-label-review {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="contour-label-review-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          overflow-y: scroll;
          scrollbar-width: auto;
          scrollbar-color: #4a5568 #1b1f27;
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 14px;
          background: #1b1f27;
          color: #e6e9ef;
          box-sizing: border-box;
        }
        .wrap::-webkit-scrollbar {
          width: 12px;
        }
        .wrap::-webkit-scrollbar-track {
          background: #1b1f27;
        }
        .wrap::-webkit-scrollbar-thumb {
          background: #4a5568;
          border-radius: 6px;
          border: 2px solid #1b1f27;
        }
        .header h2 {
          margin: 0 0 4px;
          font-size: 16px;
        }
        .header p {
          margin: 0;
          font-size: 12px;
          line-height: 1.5;
          color: #9aa5b5;
        }
        .summary {
          font-size: 12px;
          color: #cbd5e1;
          padding: 8px 10px;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 4px;
        }
        .item-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .card {
          border: 1px solid #333c48;
          border-radius: 6px;
          background: #1f242d;
          padding: 10px;
        }
        .card.answered {
          border-color: #2f7a4f;
          background: #19231d;
        }
        .card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 8px;
        }
        .plan-chip {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #9aa5b5;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 3px;
          padding: 2px 6px;
        }
        .review-id {
          font-size: 10px;
          color: #566073;
          font-family: monospace;
        }
        .label-image {
          display: block;
          max-width: 100%;
          background: #fff;
          border-radius: 4px;
          border: 1px solid #3a4454;
          cursor: pointer;
          margin-bottom: 8px;
        }
        .ocr-line {
          font-size: 12px;
          color: #cbd5e1;
          margin-bottom: 4px;
        }
        .ocr-text {
          font-family: monospace;
          color: #e6e9ef;
        }
        .reason-line {
          font-size: 11.5px;
          color: #9aa5b5;
          margin-bottom: 8px;
          line-height: 1.4;
        }
        .answered-badge {
          font-size: 12px;
          color: #4ade80;
          margin-bottom: 8px;
        }
        .actions {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
          margin-bottom: 8px;
        }
        button {
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        button:hover {
          background: #344258;
        }
        .accept-button {
          border-color: #2f7a4f;
          background: #1f4a33;
        }
        .accept-button:hover {
          background: #276240;
        }
        .reject-button {
          border-color: #7a3a3a;
          background: #4a2020;
        }
        .reject-button:hover {
          background: #5a2828;
        }
        .custom-row {
          display: flex;
          gap: 8px;
        }
        .custom-input {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 12px;
          padding: 6px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          box-sizing: border-box;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.82);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }
      </style>
      <div class="wrap">
        <div class="header">
          <h2>Contour Label Review</h2>
          <p>
            Each card below is an OCR reading <code>scripts/extract_vector_layers.py</code> wasn't confident enough
            to auto-apply (not a multiple of the site's established 5m contour interval). Click the image (or
            Accept) if the reading looks right after all, Reject if it's not really a label, or type the correct
            value yourself. Answers are written to
            <code>.desk_temp/contour-label-review-log.json</code> for Claude to read.
          </p>
        </div>
        <div class="summary"></div>
        <div class="item-list"></div>
        <div class="status-overlay"></div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <contour-label-review></contour-label-review>
  </body>
</html>
