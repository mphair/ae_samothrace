<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Layered Map</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0d1420;
      }
      layered-map {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="layered-map-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .map-pane {
          position: relative;
          width: 100%;
          height: 100%;
          background: #0d1420;
          overflow: hidden;
          box-sizing: border-box;
        }
        .map-canvas {
          display: block;
          width: 100%;
          height: 100%;
          touch-action: none;
          cursor: grab;
        }
        .map-canvas:active {
          cursor: grabbing;
        }
        .zoom-controls {
          position: absolute;
          right: 10px;
          /* Scooted up from the bottom-10px corner to leave room for
             .zoom-label below it, now that the label lives in this same
             bottom-right corner too (2026-10-20, moved from bottom-left
             -- see that rule's own comment). */
          bottom: 44px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          border: 1px solid #3a4454;
          border-radius: 4px;
          overflow: hidden;
          background: #20262f;
        }
        .zoom-in-button,
        .zoom-out-button {
          width: 28px;
          height: 26px;
          border: none;
          background: transparent;
          color: #e6e9ef;
          font-size: 15px;
          cursor: pointer;
          line-height: 1;
        }
        .zoom-in-button:hover,
        .zoom-out-button:hover {
          background: #344258;
        }
        .zoom-label {
          position: absolute;
          /* Bottom-right (2026-10-20, moved from bottom-left) -- same
             corner .zoom-controls already lives in, stacked directly
             underneath it, so both zoom-related controls read as one
             group instead of being split across opposite corners. */
          right: 10px;
          bottom: 10px;
          font-size: 11px;
          padding: 3px 6px;
          border-radius: 3px;
          background: rgba(32, 38, 47, 0.85);
          color: #cbd5e1;
          pointer-events: none;
        }
        .hover-bar {
          position: absolute;
          left: 10px;
          top: 10px;
          max-width: calc(100% - 20px);
          font-size: 12px;
          padding: 5px 9px;
          border-radius: 4px;
          background: rgba(32, 38, 47, 0.9);
          border: 1px solid #3a4454;
          color: #e6e9ef;
          pointer-events: none;
          display: none;
        }
        .empty-stack-message {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          pointer-events: none;
          padding: 16px;
        }
        .empty-stack-message span {
          font-size: 12.5px;
          color: #8a93a3;
          background: rgba(32, 38, 47, 0.75);
          border: 1px solid #3a4454;
          border-radius: 4px;
          padding: 8px 14px;
          text-align: center;
        }
        /* The topmost raster layer on the stack isn't actually visible
           at the current view -- see layered-map.ts's own
           updateRecenterTarget/recenterTarget comments for the full
           story (2026-10-19). Small, non-blocking, top-center -- unlike
           .empty-stack-message (nothing at all selected) this can
           appear while plenty of other layers ARE drawing fine. */
        .recenter-banner {
          position: absolute;
          left: 50%;
          top: 10px;
          transform: translateX(-50%);
          display: none;
          align-items: center;
          gap: 8px;
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 4px;
          background: rgba(50, 40, 20, 0.92);
          border: 1px solid #6b5a2a;
          color: #f2d9a0;
          max-width: calc(100% - 20px);
        }
        .recenter-button {
          flex: 0 0 auto;
          font-size: 11.5px;
          padding: 4px 10px;
          border-radius: 4px;
          border: 1px solid #6b5a2a;
          background: #3a2f16;
          color: #f2d9a0;
          cursor: pointer;
          white-space: nowrap;
        }
        .recenter-button:hover {
          background: #4a3c1e;
        }
        /* Attribution box -- every distinct third-party source among
           the layers currently on the stack, each a link to that
           source's own license page. See layered-map.ts's own
           sourceKeyForLayer/SOURCE_INFO comments for which layers
           count (project-original content, like every samothrace-tiles
           /samothrace-vectors layer, is never listed here at all).
           Hidden entirely (display:none, set in JS) whenever nothing
           on the stack needs attribution. */
        .sources-panel {
          position: absolute;
          left: 10px;
          bottom: 10px;
          display: none;
          flex-direction: column;
          align-items: flex-start;
          gap: 2px;
          padding: 6px 9px;
          border-radius: 4px;
          background: rgba(13, 20, 32, 0.5);
          font-size: 10.5px;
          max-width: 55%;
        }
        .sources-panel a {
          color: #9db8e8;
          text-decoration: none;
        }
        .sources-panel a:hover {
          text-decoration: underline;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.75);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }
        /* Startup load-retry UI (RetryingLoader) -- rendered INTO
           .status-overlay above (same container), not a separate
           element. */
        .retry-box {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
          max-width: 320px;
        }
        .retry-message {
          line-height: 1.4;
        }
        .retry-countdown {
          font-size: 11.5px;
          color: #9aa5b5;
        }
        .retry-button {
          margin-top: 4px;
          font-size: 12px;
          padding: 6px 14px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .retry-button:hover {
          background: #344258;
        }
      </style>
      <div class="map-pane">
        <canvas class="map-canvas"></canvas>
        <div class="hover-bar"></div>
        <div class="zoom-controls">
          <button type="button" class="zoom-in-button" title="Zoom in">+</button>
          <button type="button" class="zoom-out-button" title="Zoom out">−</button>
        </div>
        <div class="zoom-label"></div>
        <div class="empty-stack-message"><span>No layers selected — open the Layer Stack widget to add some.</span></div>
        <div class="recenter-banner">
          <span class="recenter-text"></span>
          <button type="button" class="recenter-button">Center here</button>
        </div>
        <div class="sources-panel"></div>
        <div class="status-overlay"></div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <layered-map></layered-map>
  </body>
</html>
