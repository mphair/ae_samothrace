<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Topographic Source Comparison</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      topo-compare {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="topo-compare-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          box-sizing: border-box;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: row;
          background: #1b1f27;
          color: #e6e9ef;
        }

        /* ── Explicit, always-visible scrollbars -- overlay-style
           auto-hiding scrollbars (the default in some Chromium configs)
           don't reserve layout space and can be easy to miss entirely.
           scrollbar-gutter reserves the space even before anything
           overflows; overflow-y:scroll (not auto) keeps the track always
           rendered; the ::-webkit-scrollbar rules make it visibly a
           scrollbar rather than a thin hover-only overlay. ── */
        .main-scroll,
        .log-list,
        .toc-sidebar {
          scrollbar-width: auto;
          scrollbar-color: #4a5568 #1b1f27;
          scrollbar-gutter: stable;
        }
        .main-scroll::-webkit-scrollbar,
        .log-list::-webkit-scrollbar,
        .toc-sidebar::-webkit-scrollbar {
          width: 12px;
        }
        .main-scroll::-webkit-scrollbar-track,
        .log-list::-webkit-scrollbar-track,
        .toc-sidebar::-webkit-scrollbar-track {
          background: #1b1f27;
        }
        .main-scroll::-webkit-scrollbar-thumb,
        .log-list::-webkit-scrollbar-thumb,
        .toc-sidebar::-webkit-scrollbar-thumb {
          background: #4a5568;
          border-radius: 6px;
          border: 2px solid #1b1f27;
        }
        .main-scroll::-webkit-scrollbar-thumb:hover,
        .log-list::-webkit-scrollbar-thumb:hover,
        .toc-sidebar::-webkit-scrollbar-thumb:hover {
          background: #5a6578;
        }

        /* ── Sidebar: view controls (mode/zoom) + table of contents ── */
        .toc-sidebar {
          flex: 0 0 172px;
          overflow-y: scroll;
          box-sizing: border-box;
          padding: 12px 8px;
          background: #181c23;
          border-right: 1px solid #333c48;
        }
        .toc-title {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.05em;
          color: #70798a;
          padding: 0 6px 8px;
        }
        .toc-title:not(:first-child) {
          margin-top: 10px;
          padding-top: 10px;
          border-top: 1px solid #262c36;
        }
        .toc-item {
          display: block;
          width: 100%;
          box-sizing: border-box;
          text-align: left;
          background: none;
          border: none;
          color: #cbd5e1;
          font-size: 12px;
          padding: 7px 6px;
          border-radius: 4px;
          cursor: pointer;
          line-height: 1.3;
        }
        .toc-item:hover {
          background: #242b36;
          color: #e6e9ef;
        }

        /* ── Main scrollable column ── */
        .main-scroll {
          position: relative; /* establishes the offsetParent sections' offsetTop is measured against */
          flex: 1 1 auto;
          min-width: 0;
          overflow-y: scroll;
          box-sizing: border-box;
          padding: 14px;
          display: flex;
          flex-direction: column;
          gap: 14px;
        }

        .header h2 {
          margin: 0 0 4px;
          font-size: 16px;
        }
        .header p {
          margin: 0;
          font-size: 12px;
          line-height: 1.5;
          color: #9aa5b5;
        }

        /* ── Collapsible sections ── */
        .panel-section {
          border: 1px solid #262c36;
          border-radius: 6px;
          background: #1f242d;
        }
        .section-header {
          display: flex;
          align-items: center;
          gap: 8px;
          width: 100%;
          box-sizing: border-box;
          text-align: left;
          background: #20262f;
          border: none;
          border-radius: 6px 6px 0 0;
          color: #e6e9ef;
          padding: 8px 10px;
          cursor: pointer;
        }
        .panel-section.collapsed .section-header {
          border-radius: 6px;
        }
        .toggle-indicator {
          display: inline-block;
          width: 10px;
          font-size: 10px;
          color: #9aa5b5;
          transition: transform 0.1s;
        }
        .panel-section.collapsed .toggle-indicator {
          transform: rotate(-90deg);
        }
        .section-title {
          font-size: 12px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #9aa5b5;
        }
        .section-body {
          padding: 10px;
        }
        .panel-section.collapsed .section-body {
          display: none;
        }

        .side-row {
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
        }
        .side-col {
          /* explicit basis (not auto) so the canvas's own width:100%
             below has an unambiguous definite-width parent to resolve
             against, instead of participating in flex's content-based
             auto-sizing alongside a percentage-width child. */
          flex: 0 0 360px;
          max-width: 360px;
        }
        .col-label {
          font-size: 11px;
          color: #cbd5e1;
          margin-bottom: 4px;
        }

        /* ── Reduced image footprint: capped well below full container
           width so four-plus panels don't force excessive scrolling. ── */
        canvas.compare-canvas {
          display: block;
          width: 100%;
          max-width: 360px;
          height: auto;
          aspect-ratio: 1 / 1;
          background: #808080;
          border: 1px solid #333c48;
          border-radius: 4px;
          touch-action: none;
          cursor: crosshair;
        }

        .combined-select,
        .vector-plan-select {
          margin-bottom: 8px;
          font-size: 12px;
          padding: 5px 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
        }
        .vector-controls {
          display: flex;
          align-items: center;
          gap: 14px;
          flex-wrap: wrap;
          margin-bottom: 8px;
        }
        .vector-toggle {
          display: flex;
          align-items: center;
          gap: 5px;
          font-size: 12px;
          color: #cbd5e1;
          cursor: pointer;
        }
        .vector-legend {
          font-size: 11px;
          color: #70798a;
          margin-top: 6px;
          line-height: 1.5;
        }
        .vector-legend .swatch-inline {
          display: inline-block;
          width: 10px;
          height: 10px;
          border-radius: 2px;
          margin-right: 4px;
          vertical-align: middle;
        }
        .edit-toggle-button.active {
          background: #6d3a9a;
          border-color: #8b5cf6;
          color: #fff;
        }
        .edit-panel {
          margin-top: 10px;
          padding: 8px 10px;
          border: 1px solid #333c48;
          border-radius: 4px;
          background: #181c23;
        }
        .edit-status {
          font-size: 12px;
          color: #cbd5e1;
          min-height: 16px;
          margin-bottom: 6px;
        }
        .edit-buttons {
          display: flex;
          gap: 8px;
          flex-wrap: wrap;
        }
        .edit-merge-button:not(:disabled) {
          border-color: #2f5d7a;
          background: #1f3a4a;
        }
        .edit-delete-button:not(:disabled) {
          border-color: #7a3a3a;
          background: #4a2020;
        }
        .edit-help {
          font-size: 11px;
          color: #70798a;
          line-height: 1.5;
          margin-top: 8px;
        }

        /* ── View controls, now in the sidebar (moved out of a
           main-scroll toolbar) -- stacked vertically to fit the
           sidebar's narrow width instead of the side-by-side row shape
           they used when they lived in a horizontal toolbar. ── */
        .sidebar-mode-toggle {
          display: flex;
          flex-direction: column;
          border: 1px solid #3a4454;
          border-radius: 4px;
          overflow: hidden;
          margin: 0 6px 8px;
        }
        .sidebar-mode-toggle button {
          border: none;
          border-radius: 0;
          background: #20262f;
          text-align: left;
        }
        .sidebar-mode-toggle button:hover:not(:disabled) {
          background: #2a3444;
        }
        .sidebar-mode-toggle button.active {
          background: #2f5d7a;
          color: #fff;
        }
        .toc-sidebar .reset-zoom-button {
          display: block;
          width: calc(100% - 12px);
          margin: 0 6px 8px;
          box-sizing: border-box;
        }
        .zoom-readout {
          display: block;
          font-size: 11px;
          color: #9aa5b5;
          padding: 0 6px;
          line-height: 1.4;
        }

        .composer {
          position: sticky;
          bottom: 0;
          background: #20262f;
          border: 1px solid #3a4454;
          border-radius: 6px;
          padding: 10px;
          z-index: 5;
          flex: 0 0 auto;
        }
        .pending-label {
          font-size: 12px;
          color: #cbd5e1;
          margin-bottom: 6px;
          min-height: 16px;
        }
        .comment-input {
          width: 100%;
          box-sizing: border-box;
          min-height: 52px;
          font-size: 12px;
          padding: 6px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          resize: vertical;
          font-family: inherit;
        }
        .composer-buttons {
          display: flex;
          gap: 8px;
          margin-top: 6px;
        }
        button {
          font-size: 12px;
          padding: 6px 12px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        button:hover:not(:disabled) {
          background: #344258;
        }
        button:disabled {
          opacity: 0.45;
          cursor: default;
        }
        .save-button {
          border-color: #2f7a4f;
          background: #1f4a33;
        }
        .save-button:hover:not(:disabled) {
          background: #276240;
        }

        .log-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 8px;
        }
        .clear-all-button {
          font-size: 11px;
          padding: 4px 9px;
        }
        .log-list {
          max-height: 260px;
          overflow-y: scroll;
          border: 1px solid #333c48;
          border-radius: 4px;
          background: #181c23;
        }
        .log-empty {
          padding: 12px;
          font-size: 12px;
          color: #70798a;
          text-align: center;
        }
        .log-entry {
          display: flex;
          align-items: flex-start;
          gap: 8px;
          padding: 7px 9px;
          border-bottom: 1px solid #262c36;
          font-size: 12px;
        }
        .log-entry:last-child {
          border-bottom: none;
        }
        .log-entry:hover {
          background: #242b36;
        }
        .log-entry .swatch {
          width: 10px;
          height: 10px;
          border-radius: 2px;
          flex: 0 0 auto;
          margin-top: 3px;
        }
        .entry-body {
          flex: 1 1 auto;
          min-width: 0;
        }
        .entry-meta {
          color: #9aa5b5;
          font-size: 10.5px;
          margin-bottom: 2px;
        }
        .entry-comment {
          white-space: pre-wrap;
          word-break: break-word;
        }
        .entry-comment em {
          color: #70798a;
        }
        .delete-btn {
          flex: 0 0 auto;
          background: none;
          border: none;
          color: #9aa5b5;
          cursor: pointer;
          font-size: 15px;
          line-height: 1;
          padding: 2px 4px;
        }
        .delete-btn:hover {
          color: #e6788a;
          background: none;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.82);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }
      </style>
      <div class="wrap">
        <nav class="toc-sidebar">
          <div class="toc-title">View</div>
          <div class="sidebar-mode-toggle">
            <button type="button" class="mode-comment active">💬 Comment</button>
            <button type="button" class="mode-zoom">🔍 Zoom</button>
          </div>
          <button type="button" class="reset-zoom-button">⟲ Reset zoom</button>
          <div class="zoom-readout">Showing full extent</div>

          <div class="toc-title">Contents</div>
          <button type="button" class="toc-item" data-target="header">Topographic Source Comparison</button>
          <button type="button" class="toc-item" data-target="side-by-side">(a) Side by side</button>
          <button type="button" class="toc-item" data-target="overlay">(b) Overlay</button>
          <button type="button" class="toc-item" data-target="combined">(c) Combined result</button>
          <button type="button" class="toc-item" data-target="vectors">(d) Extracted vectors</button>
          <button type="button" class="toc-item" data-target="log">Selection log</button>
        </nav>

        <div class="main-scroll">
          <div class="header" data-section-id="header">
            <h2>Topographic Source Comparison</h2>
            <p>
              Zoom 18 tile grid, x:149661–149663 y:98763–98765 (the whole site), stitched into one 768×768 px image.
              All panels below share that same pixel space and the same zoom, so a rectangle (or a zoomed-in crop) on
              one lines up with the same spot on every other. In <strong>Comment</strong> mode, drag a rectangle on
              any image, write a comment, then Save — it's appended to the log below and written to
              <code>.desk_temp/topo-compare-log.json</code> for Claude to read. In <strong>Zoom</strong> mode, drag a
              rectangle to zoom all panels to that region; Reset zoom returns to the full site.
            </p>
          </div>

          <section class="panel-section" data-section-id="side-by-side">
            <button type="button" class="section-header">
              <span class="toggle-indicator">▾</span>
              <span class="section-title">(a) Side by side — original sources</span>
            </button>
            <div class="section-body">
              <div class="side-row">
                <div class="side-col">
                  <div class="col-label">Actual State Plan (source)</div>
                  <canvas class="compare-canvas panel-actual"></canvas>
                </div>
                <div class="side-col">
                  <div class="col-label">Restored State Plan (source)</div>
                  <canvas class="compare-canvas panel-restored"></canvas>
                </div>
              </div>
            </div>
          </section>

          <section class="panel-section" data-section-id="overlay">
            <button type="button" class="section-header">
              <span class="toggle-indicator">▾</span>
              <span class="section-title">(b) Overlay — red = Actual, cyan = Restored</span>
            </button>
            <div class="section-body">
              <canvas class="compare-canvas panel-overlay"></canvas>
            </div>
          </section>

          <section class="panel-section" data-section-id="combined">
            <button type="button" class="section-header">
              <span class="toggle-indicator">▾</span>
              <span class="section-title">(c) Combined result (served layer)</span>
            </button>
            <div class="section-body">
              <select class="combined-select"></select>
              <canvas class="compare-canvas panel-combined"></canvas>
            </div>
          </section>

          <section class="panel-section" data-section-id="vectors">
            <button type="button" class="section-header">
              <span class="toggle-indicator">▾</span>
              <span class="section-title">(d) Extracted vector layers</span>
            </button>
            <div class="section-body">
              <div class="vector-controls">
                <select class="vector-plan-select"></select>
                <label class="vector-toggle"><input type="checkbox" class="vector-show-contours" checked /> Contours</label>
                <label class="vector-toggle"><input type="checkbox" class="vector-show-streams" checked /> Streams</label>
                <button type="button" class="edit-toggle-button">✏️ Edit corrections</button>
              </div>
              <canvas class="compare-canvas panel-vectors"></canvas>
              <div class="vector-legend">
                <span class="swatch-inline" style="background:#f59e0b"></span>unlabeled contour &nbsp;
                <span class="swatch-inline" style="background:#c026d3"></span>contour with read elevation &nbsp;
                <span class="swatch-inline" style="background:#0ea5e9"></span>stream &nbsp;
                — from <code>scripts/extract_vector_layers.py</code>
              </div>
              <div class="edit-panel">
                <div class="edit-status"></div>
                <div class="edit-buttons">
                  <button type="button" class="edit-delete-button" disabled>Delete selected</button>
                  <button type="button" class="edit-merge-button" disabled>Merge with next click</button>
                  <button type="button" class="edit-cancel-button" disabled>Cancel selection</button>
                  <button type="button" class="edit-undo-button" disabled>Undo</button>
                  <button type="button" class="edit-save-button">Save corrections</button>
                </div>
                <div class="edit-help">
                  Click <strong>✏️ Edit corrections</strong> above, then click a line to select it (zoom in first for
                  precision in crowded areas). <strong>Delete</strong> removes a false positive (e.g. a digit
                  misdetected as a contour). <strong>Merge</strong>, then click a second line, joins two fragments
                  that should be one continuous line — bridging a gap left by a building, or reconnecting pieces that
                  got split. Corrections are saved separately from the extractor's own output
                  (<code>*.corrections.json</code>), so re-running <code>extract_vector_layers.py</code> never
                  overwrites them.
                </div>
              </div>
            </div>
          </section>

          <div class="composer">
            <div class="pending-label">No selection — drag a rectangle on any image above.</div>
            <textarea class="comment-input" placeholder="Comment about this region…"></textarea>
            <div class="composer-buttons">
              <button type="button" class="save-button" disabled>Save</button>
              <button type="button" class="discard-button">Discard</button>
            </div>
          </div>

          <section class="panel-section" data-section-id="log">
            <button type="button" class="section-header">
              <span class="toggle-indicator">▾</span>
              <span class="section-title">Selection log</span>
            </button>
            <div class="section-body">
              <div class="log-header">
                <span></span>
                <button type="button" class="clear-all-button">Clear all</button>
              </div>
              <div class="log-list"></div>
            </div>
          </section>
        </div>

        <div class="status-overlay"></div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <topo-compare></topo-compare>
  </body>
</html>
