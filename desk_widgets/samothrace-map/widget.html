<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Samothrace Map</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      samothrace-map {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="samothrace-map-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          background: #1b1f27;
          color: #e6e9ef;
        }
        .toolbar {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px;
          background: #20262f;
          border-bottom: 1px solid #333c48;
          flex: 0 0 auto;
        }
        .monument-select {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 13px;
          padding: 5px 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
        }
        .home-button {
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          white-space: nowrap;
        }
        .home-button:hover {
          background: #344258;
        }
        .recording-indicator {
          display: none;
          align-items: center;
          gap: 6px;
          padding: 5px 10px;
          border-radius: 12px;
          background: rgba(220, 38, 38, 0.18);
          border: 1px solid rgba(220, 38, 38, 0.5);
          color: #fca5a5;
          font-size: 11.5px;
          white-space: nowrap;
        }
        .recording-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #ef4444;
          flex: 0 0 auto;
          animation: recording-pulse 1.4s ease-in-out infinite;
        }
        @keyframes recording-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.35; }
        }
        .body-row {
          position: relative;
          flex: 1 1 auto;
          display: flex;
          min-height: 0;
        }
        .layers-panel {
          flex: 0 0 200px;
          overflow-y: auto;
          background: #181c23;
          border-right: 1px solid #333c48;
          padding: 10px 10px 16px;
          box-sizing: border-box;
          font-size: 12px;
        }
        .layer-group {
          margin: 14px 0 0;
        }
        .layer-group:first-of-type {
          margin-top: 0;
        }
        .layer-group-title {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #8a93a3;
          margin: 0 0 4px;
          cursor: pointer;
          user-select: none;
        }
        .layer-row {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 3px 0;
          cursor: pointer;
          user-select: none;
          line-height: 1.3;
        }
        .layer-row input {
          flex: 0 0 auto;
        }
        .debug-section {
          margin-top: 14px;
          padding-top: 10px;
          border-top: 1px solid #333c48;
        }
        .debug-summary {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #8a93a3;
          cursor: pointer;
          user-select: none;
        }
        .debug-section[open] .debug-summary {
          margin-bottom: 8px;
        }
        .debug-clear-button {
          margin-top: 4px;
          font-size: 11px;
          padding: 3px 8px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .debug-clear-button:hover {
          background: #344258;
        }
        .map-pane {
          position: relative;
          flex: 1 1 auto;
          min-width: 0;
          background: #808080;
          overflow: hidden;
        }
        .map-canvas {
          display: block;
          width: 100%;
          height: 100%;
          touch-action: none;
          cursor: grab;
        }
        .map-canvas:active {
          cursor: grabbing;
        }
        .zoom-controls {
          position: absolute;
          right: 10px;
          bottom: 10px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          border: 1px solid #3a4454;
          border-radius: 4px;
          overflow: hidden;
          background: #20262f;
        }
        .zoom-in-button,
        .zoom-out-button {
          width: 28px;
          height: 26px;
          border: none;
          background: transparent;
          color: #e6e9ef;
          font-size: 15px;
          cursor: pointer;
          line-height: 1;
        }
        .zoom-in-button:hover,
        .zoom-out-button:hover {
          background: #344258;
        }
        .zoom-label {
          position: absolute;
          left: 10px;
          bottom: 10px;
          font-size: 11px;
          padding: 3px 6px;
          border-radius: 3px;
          background: rgba(32, 38, 47, 0.85);
          color: #cbd5e1;
          pointer-events: none;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.75);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }

        /* ── Q&A panel (phase 4 of plans/samothrace-map-consolidation.md) ── */
        .qa-panel {
          flex: 0 0 300px;
          display: flex;
          flex-direction: column;
          min-height: 0;
          background: #181c23;
          border-left: 1px solid #333c48;
          box-sizing: border-box;
        }
        .qa-panel-header {
          flex: 0 0 auto;
          min-height: 8px;
          padding: 8px 10px 0;
        }
        .qa-tabs {
          flex: 0 0 auto;
          display: flex;
          gap: 3px;
          padding: 8px 10px 0;
          border-bottom: 1px solid #333c48;
        }
        .qa-tab-button {
          font-size: 11.5px;
          padding: 6px 8px;
          border-radius: 4px 4px 0 0;
          border: 1px solid #333c48;
          border-bottom: none;
          background: #20262f;
          color: #9aa5b5;
          cursor: pointer;
          white-space: nowrap;
        }
        .qa-tab-button.active {
          background: #1b1f27;
          color: #e6e9ef;
        }
        .qa-tab-button:hover:not(.active) {
          background: #2a3444;
        }
        .qa-summary {
          flex: 0 0 auto;
          font-size: 11.5px;
          color: #cbd5e1;
          padding: 8px 10px;
        }
        .qa-tab-content {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
          padding: 0 10px 14px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          scrollbar-width: auto;
          scrollbar-color: #4a5568 #1b1f27;
        }
        .qa-tab-content::-webkit-scrollbar {
          width: 12px;
        }
        .qa-tab-content::-webkit-scrollbar-thumb {
          background: #4a5568;
          border-radius: 6px;
          border: 2px solid #1b1f27;
        }
        .qa-empty {
          font-size: 12px;
          color: #70798a;
          padding: 10px 0;
        }
        .qa-card {
          border: 1px solid #333c48;
          border-radius: 6px;
          background: #1f242d;
          padding: 9px;
          font-size: 11.5px;
        }
        .qa-card.answered {
          border-color: #2f7a4f;
          background: #19231d;
        }
        .qa-card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 6px;
          margin-bottom: 7px;
        }
        .qa-plan-chip {
          font-size: 9.5px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #9aa5b5;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 3px;
          padding: 2px 5px;
        }
        .qa-show-me-button {
          font-size: 10.5px;
          padding: 3px 7px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-show-me-button:hover {
          background: #344258;
        }
        .qa-label-image {
          display: block;
          max-width: 100%;
          background: #fff;
          border-radius: 4px;
          border: 1px solid #3a4454;
          cursor: pointer;
          margin-bottom: 7px;
        }
        .qa-ocr-line {
          color: #cbd5e1;
          margin-bottom: 4px;
        }
        .qa-ocr-text {
          font-family: monospace;
          color: #e6e9ef;
        }
        .qa-reason-line {
          font-size: 11px;
          color: #9aa5b5;
          margin-bottom: 7px;
          line-height: 1.4;
        }
        .qa-answered-badge {
          font-size: 11.5px;
          color: #4ade80;
          margin-bottom: 7px;
        }
        .qa-actions {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          margin-bottom: 7px;
        }
        .qa-accept-button,
        .qa-reject-button,
        .qa-custom-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-accept-button {
          border-color: #2f7a4f;
          background: #1f4a33;
        }
        .qa-accept-button:hover {
          background: #276240;
        }
        .qa-reject-button {
          border-color: #7a3a3a;
          background: #4a2020;
        }
        .qa-reject-button:hover {
          background: #5a2828;
        }
        .qa-custom-row {
          display: flex;
          gap: 6px;
        }
        .qa-custom-input {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 11px;
          padding: 5px 7px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          box-sizing: border-box;
        }

        /* ── Minor contour bands tab (phase 5) ── */
        .qa-mb-nav {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
        }
        .qa-mb-prev-button,
        .qa-mb-next-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          flex: 0 0 auto;
        }
        .qa-mb-prev-button:hover:not(:disabled),
        .qa-mb-next-button:hover:not(:disabled) {
          background: #344258;
        }
        .qa-mb-prev-button:disabled,
        .qa-mb-next-button:disabled {
          opacity: 0.4;
          cursor: default;
        }
        .qa-mb-group-select {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 11px;
          padding: 5px 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
        }
        .qa-mb-skip-unanswered-button {
          display: block;
          width: 100%;
          font-size: 11px;
          padding: 5px 8px;
          margin-bottom: 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-mb-skip-unanswered-button:hover {
          background: #344258;
        }
        .qa-mb-fragment-list {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 8px;
        }
        .qa-mb-fragment-row {
          display: flex;
          align-items: center;
          gap: 6px;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 4px;
          padding: 5px 6px;
          font-size: 11px;
        }
        .qa-mb-swatch {
          width: 10px;
          height: 10px;
          border-radius: 2px;
          flex: 0 0 auto;
        }
        .qa-mb-frag-id {
          color: #70798a;
          font-family: monospace;
          flex: 0 0 auto;
          width: 38px;
        }
        .qa-mb-elev-input {
          width: 52px;
          font-size: 11px;
          padding: 3px 5px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          box-sizing: border-box;
        }
        .qa-mb-not-contour-label {
          display: flex;
          align-items: center;
          gap: 3px;
          color: #9aa5b5;
          white-space: nowrap;
          font-size: 10.5px;
        }
        .qa-mb-skip-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-mb-skip-button:hover {
          background: #344258;
        }

        /* ── Contour connector tab (phase 6) ── */
        .qa-help-text {
          font-size: 11px;
          color: #70798a;
          line-height: 1.5;
          margin-bottom: 10px;
        }
        .qa-cc-toolbar {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 8px;
          padding-bottom: 8px;
          border-bottom: 1px solid #333c48;
        }
        .qa-cc-toggle {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11.5px;
        }
        .qa-cc-slider-row {
          display: flex;
          flex-direction: column;
          gap: 3px;
          margin-top: 4px;
        }
        .qa-cc-slider-row label {
          font-size: 11px;
          color: #cbd5e1;
          display: flex;
          justify-content: space-between;
        }
        .qa-cc-max-dist {
          width: 100%;
        }
        .qa-cc-list-title {
          font-size: 11px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #9aa5b5;
          margin: 0 0 8px;
        }
      </style>
      <div class="wrap">
        <div class="toolbar">
          <select class="monument-select"><option value="">Loading…</option></select>
          <button type="button" class="home-button" title="Zoom to overview">⟲ Overview</button>
        </div>
        <div class="body-row">
          <div class="layers-panel">
            <div class="layers-list"></div>
            <details class="debug-section">
              <summary class="debug-summary">Debug</summary>
              <label class="layer-row"><input type="checkbox" class="debug-hit-trace-toggle" /> Hit-test trace</label>
              <button type="button" class="debug-clear-button">Clear trace</button>
            </details>
          </div>
          <div class="map-pane">
            <canvas class="map-canvas"></canvas>
            <div class="zoom-controls">
              <button type="button" class="zoom-in-button" title="Zoom in">+</button>
              <button type="button" class="zoom-out-button" title="Zoom out">−</button>
            </div>
            <div class="zoom-label"></div>
            <div class="status-overlay"></div>
          </div>
          <div class="qa-panel">
            <div class="qa-panel-header">
              <div class="recording-indicator" title="Claude is recording -- interactions here are being logged for correlation against the voice transcript">
                <span class="recording-dot"></span>
                <span>Recording</span>
              </div>
            </div>
            <div class="qa-tabs">
              <button type="button" class="qa-tab-button active" data-tab="agent-qa">Q/A</button>
              <button type="button" class="qa-tab-button" data-tab="label-review">Label</button>
              <button type="button" class="qa-tab-button" data-tab="minor-bands">Minor Bands</button>
              <button type="button" class="qa-tab-button" data-tab="contour-connector">Connector</button>
            </div>
            <div class="qa-summary"></div>
            <div class="qa-tab-content"></div>
          </div>
        </div>
      </div>
    </template>
    <script>
      /* BUILD:COMPILED_JS */
    </script>
    <samothrace-map></samothrace-map>
  </body>
</html>
