<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Samothrace Map</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #11151c;
      }
      samothrace-map {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <template id="samothrace-map-template">
      <style>
        :host {
          display: block;
          width: 100%;
          height: 100%;
          font-family: Arial, Helvetica, sans-serif;
        }
        .wrap {
          position: relative;
          width: 100%;
          height: 100%;
          display: flex;
          flex-direction: column;
          background: #1b1f27;
          color: #e6e9ef;
        }
        .toolbar {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 8px;
          background: #20262f;
          border-bottom: 1px solid #333c48;
          flex: 0 0 auto;
        }
        .monument-select {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 13px;
          padding: 5px 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
        }
        .home-button {
          font-size: 12px;
          padding: 6px 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          white-space: nowrap;
        }
        .home-button:hover {
          background: #344258;
        }
        .recording-indicator {
          display: none;
          align-items: center;
          gap: 6px;
          padding: 5px 10px;
          border-radius: 12px;
          background: rgba(220, 38, 38, 0.18);
          border: 1px solid rgba(220, 38, 38, 0.5);
          color: #fca5a5;
          font-size: 11.5px;
          white-space: nowrap;
        }
        .recording-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #ef4444;
          flex: 0 0 auto;
          animation: recording-pulse 1.4s ease-in-out infinite;
        }
        @keyframes recording-pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.35; }
        }
        .body-row {
          position: relative;
          flex: 1 1 auto;
          display: flex;
          min-height: 0;
        }
        .layers-panel {
          flex: 0 0 200px;
          overflow-y: auto;
          background: #181c23;
          border-right: 1px solid #333c48;
          padding: 10px 10px 16px;
          box-sizing: border-box;
          font-size: 12px;
        }
        .layer-group {
          margin: 14px 0 0;
        }
        .layer-group:first-of-type {
          margin-top: 0;
        }
        .layer-group-title {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #8a93a3;
          margin: 0 0 4px;
          cursor: pointer;
          user-select: none;
        }
        .layer-row {
          display: flex;
          align-items: center;
          gap: 6px;
          padding: 3px 0;
          cursor: pointer;
          user-select: none;
          line-height: 1.3;
        }
        .layer-row input {
          flex: 0 0 auto;
        }
        .debug-section {
          margin-top: 14px;
          padding-top: 10px;
          border-top: 1px solid #333c48;
        }
        .debug-summary {
          font-size: 10px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #8a93a3;
          cursor: pointer;
          user-select: none;
        }
        .debug-section[open] .debug-summary {
          margin-bottom: 8px;
        }
        .debug-clear-button {
          margin-top: 4px;
          font-size: 11px;
          padding: 3px 8px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .debug-clear-button:hover {
          background: #344258;
        }
        .map-pane {
          position: relative;
          flex: 1 1 auto;
          min-width: 0;
          background: #808080;
          overflow: hidden;
        }
        .map-canvas {
          display: block;
          width: 100%;
          height: 100%;
          touch-action: none;
          cursor: grab;
        }
        .map-canvas:active {
          cursor: grabbing;
        }
        /* Live preview for the Agent Q&A tab's 'adjust-image-transform'
           question -- see samothrace-map-agent-qa-tab.ts's own header
           comment and SamothraceMapElement.positionImageOverlay. A real
           <img>, not canvas-drawn, so the browser's own CSS 3D transform
           engine renders rotate/tilt/perspective natively; `left`/`top`/
           `width`/`height`/`transform` are all set inline, per redraw,
           in TS -- nothing here but the parts that don't change.
           Semi-transparent by default (not full opacity) so the real map
           underneath stays visible for comparison while adjusting --
           an "onion-skin" overlay, the whole point of this tool. */
        .image-overlay {
          position: absolute;
          left: 0;
          top: 0;
          transform-origin: center center;
          opacity: 0.72;
          cursor: grab;
          touch-action: none;
          user-select: none;
          -webkit-user-drag: none;
        }
        .image-overlay.dragging {
          cursor: grabbing;
          opacity: 0.85;
        }
        /* Recording-mode toolbar -- top-center over the map, only shown
           while a recording is active (same gating as
           .recording-indicator, both driven by RecordingController.
           onChange). Two stacked rows: the always-present 3-button row
           (screenshot now / screenshot in 5s / annotate toggle), and a
           second row of 7 pen swatches + Clear that only appears while
           the annotation layer is actually toggled on -- see
           samothrace-map.ts's own "annotation layer" section for the
           full story (pan/zoom is deliberately disabled while this is
           on; screenshots are saved as self-contained base64-image HTML
           files, not real .png, since the Bridge's own fs.writeFile is
           text-only). */
        .annotate-toolbar {
          position: absolute;
          top: 10px;
          left: 50%;
          transform: translateX(-50%);
          display: none;
          align-items: center;
          gap: 6px;
          padding: 6px;
          border-radius: 6px;
          background: rgba(32, 38, 47, 0.92);
          border: 1px solid #3a4454;
          z-index: 15;
        }
        .annotate-toolbar button {
          font-size: 11.5px;
          padding: 6px 9px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          white-space: nowrap;
        }
        .annotate-toolbar button:hover {
          background: #344258;
        }
        .annotate-toggle-button.active {
          border-color: #2f7a4f;
          background: #1f4a33;
        }
        .annotate-toggle-button.active:hover {
          background: #276240;
        }
        .annotate-palette-row {
          position: absolute;
          top: 48px;
          left: 50%;
          transform: translateX(-50%);
          display: none;
          align-items: center;
          gap: 5px;
          padding: 5px 6px;
          border-radius: 6px;
          background: rgba(32, 38, 47, 0.92);
          border: 1px solid #3a4454;
          z-index: 15;
        }
        .annotate-swatch {
          width: 18px;
          height: 18px;
          padding: 0;
          border-radius: 3px;
          border: 1px solid rgba(255, 255, 255, 0.35);
          cursor: pointer;
        }
        .annotate-swatch.active {
          outline: 2px solid #fff;
          outline-offset: 1px;
        }
        .annotate-clear-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          white-space: nowrap;
        }
        .annotate-clear-button:hover {
          background: #344258;
        }
        .map-canvas.annotating {
          cursor: crosshair;
        }
        .zoom-controls {
          position: absolute;
          right: 10px;
          bottom: 10px;
          display: flex;
          flex-direction: column;
          align-items: stretch;
          border: 1px solid #3a4454;
          border-radius: 4px;
          overflow: hidden;
          background: #20262f;
        }
        .zoom-in-button,
        .zoom-out-button {
          width: 28px;
          height: 26px;
          border: none;
          background: transparent;
          color: #e6e9ef;
          font-size: 15px;
          cursor: pointer;
          line-height: 1;
        }
        .zoom-in-button:hover,
        .zoom-out-button:hover {
          background: #344258;
        }
        .zoom-label {
          position: absolute;
          left: 10px;
          bottom: 10px;
          font-size: 11px;
          padding: 3px 6px;
          border-radius: 3px;
          background: rgba(32, 38, 47, 0.85);
          color: #cbd5e1;
          pointer-events: none;
        }
        .status-overlay {
          position: absolute;
          inset: 0;
          display: none;
          align-items: center;
          justify-content: center;
          background: rgba(17, 21, 28, 0.75);
          color: #e6e9ef;
          font-size: 13px;
          z-index: 20;
          text-align: center;
          padding: 16px;
        }

        /* ── Q&A panel (phase 4 of plans/samothrace-map-consolidation.md) ── */
        .qa-panel {
          flex: 0 0 300px;
          display: flex;
          flex-direction: column;
          min-height: 0;
          background: #181c23;
          border-left: 1px solid #333c48;
          box-sizing: border-box;
        }
        .qa-panel-header {
          flex: 0 0 auto;
          min-height: 8px;
          padding: 8px 10px 0;
        }
        .qa-tabs {
          flex: 0 0 auto;
          display: flex;
          gap: 3px;
          padding: 8px 10px 0;
          border-bottom: 1px solid #333c48;
        }
        .qa-tab-button {
          font-size: 11.5px;
          padding: 6px 8px;
          border-radius: 4px 4px 0 0;
          border: 1px solid #333c48;
          border-bottom: none;
          background: #20262f;
          color: #9aa5b5;
          cursor: pointer;
          white-space: nowrap;
        }
        .qa-tab-button.active {
          background: #1b1f27;
          color: #e6e9ef;
        }
        .qa-tab-button:hover:not(.active) {
          background: #2a3444;
        }
        .qa-summary {
          flex: 0 0 auto;
          font-size: 11.5px;
          color: #cbd5e1;
          padding: 8px 10px;
        }
        .qa-tab-content {
          flex: 1 1 auto;
          min-height: 0;
          overflow-y: auto;
          padding: 0 10px 14px;
          display: flex;
          flex-direction: column;
          gap: 10px;
          scrollbar-width: auto;
          scrollbar-color: #4a5568 #1b1f27;
        }
        .qa-tab-content::-webkit-scrollbar {
          width: 12px;
        }
        .qa-tab-content::-webkit-scrollbar-thumb {
          background: #4a5568;
          border-radius: 6px;
          border: 2px solid #1b1f27;
        }
        .qa-empty {
          font-size: 12px;
          color: #70798a;
          padding: 10px 0;
        }
        .qa-card {
          border: 1px solid #333c48;
          border-radius: 6px;
          background: #1f242d;
          padding: 9px;
          font-size: 11.5px;
        }
        .qa-card.answered {
          border-color: #2f7a4f;
          background: #19231d;
        }
        .qa-card-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 6px;
          margin-bottom: 7px;
        }
        .qa-plan-chip {
          font-size: 9.5px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #9aa5b5;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 3px;
          padding: 2px 5px;
        }
        .qa-show-me-button {
          font-size: 10.5px;
          padding: 3px 7px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-show-me-button:hover {
          background: #344258;
        }
        .qa-label-image {
          display: block;
          max-width: 100%;
          background: #fff;
          border-radius: 4px;
          border: 1px solid #3a4454;
          cursor: pointer;
          margin-bottom: 7px;
        }
        .qa-ocr-line {
          color: #cbd5e1;
          margin-bottom: 4px;
        }
        .qa-ocr-text {
          font-family: monospace;
          color: #e6e9ef;
        }
        .qa-reason-line {
          font-size: 11px;
          color: #9aa5b5;
          margin-bottom: 7px;
          line-height: 1.4;
        }
        .qa-answered-badge {
          font-size: 11.5px;
          color: #4ade80;
          margin-bottom: 7px;
        }
        /* AgentPatchChannel's "applied automatically" list -- see
           samothrace-map-agent-qa-tab.ts's own renderAutoApplied. A
           distinct amber-tinted strip (not the green "answered" look a
           human-confirmed qa-card gets) so an autonomously-applied
           change reads as its own category at a glance, not as just
           another already-answered question. */
        .qa-auto-applied-section {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 10px;
        }
        .qa-auto-applied-title {
          font-size: 10.5px;
          text-transform: uppercase;
          letter-spacing: 0.04em;
          color: #d8a944;
        }
        .qa-auto-row {
          border: 1px solid #4a3b1f;
          border-radius: 6px;
          background: #241d10;
          padding: 7px 9px;
          font-size: 11px;
        }
        .qa-auto-row-error {
          border-color: #5c2a2a;
          background: #251414;
        }
        .qa-auto-summary {
          color: #f0d9a8;
          line-height: 1.4;
        }
        .qa-auto-row-error .qa-auto-summary {
          color: #f3b4b4;
        }
        .qa-auto-reason {
          color: #9aa5b5;
          font-size: 10.5px;
          margin-top: 3px;
          line-height: 1.35;
        }
        .qa-auto-time {
          color: #70798a;
          font-size: 9.5px;
          margin-top: 4px;
        }
        .qa-ok-button {
          font-size: 10.5px;
          padding: 3px 7px;
          border-radius: 3px;
          border: 1px solid #2f7a4f;
          background: #1f3a28;
          color: #c7f0d6;
          cursor: pointer;
        }
        .qa-ok-button:hover {
          background: #27492f;
        }
        .qa-undo-button {
          font-size: 10.5px;
          padding: 3px 7px;
          border-radius: 3px;
          border: 1px solid #5c4a24;
          background: #2e2512;
          color: #f0d9a8;
          cursor: pointer;
        }
        .qa-undo-button:hover {
          background: #3c2f17;
        }
        /* Archiving -- see samothrace-map-agent-qa-tab.ts's own
           startArchiving/QA_ARCHIVE_DELAY_MS (8500ms total, MUST stay in
           sync with the percentages below: 5000/8500=58.8%,
           8000/8500=94.1%). A @keyframes animation, not a transition --
           this renderer does a full innerHTML replace on every change, so
           there's no "previous style" for a transition to animate FROM on
           a freshly-created node; a self-contained keyframe animation
           always plays its own timeline regardless. Known limitation: if
           the whole panel re-renders for an unrelated reason while a row
           is mid-animation, its node is recreated and the animation
           visually restarts (the actual removal timer still fires on
           schedule either way) -- rare enough in practice not to be worth
           real DOM diffing to fix. */
        @keyframes qa-archive-away {
          0%, 58.8% { opacity: 1; max-height: 240px; }
          94.1% { opacity: 0; max-height: 240px; }
          100% { opacity: 0; max-height: 0; margin-top: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
        }
        .qa-archiving {
          animation: qa-archive-away 8.5s ease-out forwards;
          overflow: hidden;
        }
        .qa-archiving-message {
          font-size: 11.5px;
          color: #9aa5b5;
          font-style: italic;
        }
        /* Archive drawer -- see samothrace-map-agent-qa-tab.ts's own
           renderArchiveDrawer. Pinned toward the bottom of the Agent Q&A
           tab's scrollable content: `margin-top: auto` pushes it down to
           the bottom of the flex column when the question list is short
           (.qa-tab-content is `display:flex; flex-direction:column`, see
           that rule above), and `position: sticky; bottom: ...` keeps it
           visible at the bottom of the viewport while scrolling a long
           list. The toggle's open/close transition is a plain CSS
           `transition` (NOT a @keyframes animation like qa-archive-away
           above) -- this element is toggled via direct classList
           manipulation on the SAME existing node (see attachHandlers'
           own comment), not recreated by a fresh render(), so a
           transition has a real "previous style" to animate from. */
        .qa-archive-drawer {
          position: sticky;
          bottom: -14px; /* cancels .qa-tab-content's own 14px bottom padding so this truly touches the panel's bottom edge */
          margin-top: auto;
          margin-left: -10px;
          margin-right: -10px;
          padding: 0 10px;
          background: #161a21;
          border-top: 1px solid #333c48;
        }
        .qa-archive-toggle {
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: none;
          border: none;
          color: #9aa5b5;
          font-size: 11px;
          padding: 8px 0;
          cursor: pointer;
        }
        .qa-archive-toggle:hover {
          color: #e6e9ef;
        }
        .qa-archive-chevron {
          display: inline-block;
          transition: transform 0.3s ease;
        }
        .qa-archive-chevron.open {
          transform: rotate(180deg);
        }
        .qa-archive-body {
          max-height: 0;
          overflow: hidden;
          transition: max-height 0.3s ease;
        }
        .qa-archive-body.open {
          max-height: 320px;
          overflow-y: auto;
          padding-bottom: 10px;
        }
        .qa-archive-controls {
          display: flex;
          justify-content: flex-end;
          align-items: center;
          gap: 4px;
          margin-bottom: 8px;
          font-size: 10.5px;
          color: #9aa5b5;
        }
        .qa-archive-controls select {
          background: #20262f;
          color: #e6e9ef;
          border: 1px solid #333c48;
          border-radius: 3px;
          font-size: 10.5px;
          padding: 2px 4px;
        }
        .qa-archive-row {
          border: 1px solid #2c3340;
          border-radius: 6px;
          background: #1b2027;
          padding: 7px 9px;
          font-size: 10.5px;
          margin-bottom: 6px;
        }
        .qa-archive-row-summary {
          color: #c7cdda;
          line-height: 1.4;
        }
        .qa-archive-row-time {
          color: #70798a;
          font-size: 9.5px;
          margin: 3px 0 6px;
        }
        .qa-reset-button {
          font-size: 10px;
          padding: 3px 7px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-reset-button:hover {
          background: #344258;
        }
        .qa-actions {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          margin-bottom: 7px;
        }
        .qa-accept-button,
        .qa-reject-button,
        .qa-custom-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-accept-button {
          border-color: #2f7a4f;
          background: #1f4a33;
        }
        .qa-accept-button:hover {
          background: #276240;
        }
        .qa-reject-button {
          border-color: #7a3a3a;
          background: #4a2020;
        }
        .qa-reject-button:hover {
          background: #5a2828;
        }
        .qa-custom-row {
          display: flex;
          gap: 6px;
        }
        .qa-custom-input {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 11px;
          padding: 5px 7px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          box-sizing: border-box;
        }

        /* ── Minor contour bands tab (phase 5) ── */
        .qa-mb-nav {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-bottom: 8px;
        }
        .qa-mb-prev-button,
        .qa-mb-next-button {
          font-size: 11px;
          padding: 5px 8px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
          flex: 0 0 auto;
        }
        .qa-mb-prev-button:hover:not(:disabled),
        .qa-mb-next-button:hover:not(:disabled) {
          background: #344258;
        }
        .qa-mb-prev-button:disabled,
        .qa-mb-next-button:disabled {
          opacity: 0.4;
          cursor: default;
        }
        .qa-mb-group-select {
          flex: 1 1 auto;
          min-width: 0;
          font-size: 11px;
          padding: 5px 6px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
        }
        .qa-mb-skip-unanswered-button {
          display: block;
          width: 100%;
          font-size: 11px;
          padding: 5px 8px;
          margin-bottom: 10px;
          border-radius: 4px;
          border: 1px solid #3a4454;
          background: #2a3444;
          color: #e6e9ef;
          cursor: pointer;
        }
        .qa-mb-skip-unanswered-button:hover {
          background: #344258;
        }
        .qa-mb-fragment-list {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 8px;
        }
        .qa-mb-fragment-row {
          display: flex;
          align-items: center;
          gap: 6px;
          background: #20262f;
          border: 1px solid #333c48;
          border-radius: 4px;
          padding: 5px 6px;
          font-size: 11px;
        }
        .qa-mb-swatch {
          width: 10px;
          height: 10px;
          border-radius: 2px;
          flex: 0 0 auto;
        }
        .qa-mb-frag-id {
          color: #70798a;
          font-family: monospace;
          flex: 0 0 auto;
          width: 38px;
        }
        .qa-mb-elev-input {
          width: 52px;
          font-size: 11px;
          padding: 3px 5px;
          border-radius: 3px;
          border: 1px solid #3a4454;
          background: #11151c;
          color: #e6e9ef;
          box-sizing: border-box;
        }
        .qa-mb-not-contour-label {
          display: flex;
